description = "Read the page in a Chrome tab as text: its title, address and visible text. Faster and more exact than a screenshot. By default the tab the user sees."
command = ["/usr/bin/osascript", "-l", "JavaScript", "./chrome.js", "read", "{target}", "{chars}"]
timeout = 20
read_only = true

[params.target]
description = "Another tab, as window.tab from chrome_tabs (for example 2.3). Leave it out: the tool works on the active tab of the front window, which the user sees. Give it only when the user named another tab."
required = false

[params.chars]
type = "integer"
description = "How much text, default 6000, at most 30000"
required = false
