description = "Switch to an iTerm2 tab: the tab, its window and iTerm come to the front, so the user sees it. After that, the other iterm_* tools work on it without a target."
command = ["/usr/bin/osascript", "-l", "JavaScript", "./iterm.js", "tab", "{target}"]
timeout = 20

[params.target]
description = "The tab as window.tab from iterm_tabs, for example 2.3"
