description = "Open an address in Google Chrome: a new tab in the front window, or a window of a given profile (chrome_profiles lists them). When a tab of the same site is open already, it opens nothing and lists those tabs: then go to the right one with chrome_tab, or, if the user wants another tab of the site, call it again with new_window = \"tab\"."
command = ["/usr/bin/osascript", "-l", "JavaScript", "./chrome.js", "open", "{url}", "{profile}", "{new_window}"]
timeout = 20

[params.url]
description = "The address, for example https://example.com"

[params.profile]
description = "A profile name; leave it out for the front window"
required = false

[params.new_window]
description = "\"new\" for a new window, \"tab\" for a new tab even when the site is open already"
required = false
