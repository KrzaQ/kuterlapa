description = "Press Ctrl+C in an iTerm2 tab, to stop a command that hangs or runs too long."
command = ["/usr/bin/osascript", "-l", "JavaScript", "./iterm.js", "interrupt", "{window}", "{tab}"]
timeout = 20

[params.window]
type = "integer"
description = "Window number, or 0 for the front window"

[params.tab]
type = "integer"
description = "Tab number, or 0 for the active tab"
