description = "Open a new iTerm2 tab in the front window and bring iTerm to the front, and optionally run a command in it at once (for example ssh myserver). The other iterm_* tools then work on it without a target."
command = ["/usr/bin/osascript", "-l", "JavaScript", "./iterm.js", "new", "{command}"]
timeout = 20

[params.command]
description = "A command to run in the new tab"
required = false
