description = "Read the text of an iTerm2 tab (its last lines), straight from the terminal: better than a screenshot. Window and tab numbers come from iterm_tabs; 0 and 0 mean the front window's active tab."
command = ["/usr/bin/osascript", "-l", "JavaScript", "./iterm.js", "read", "{window}", "{tab}", "{lines}"]
timeout = 20
read_only = true

[params.window]
type = "integer"
description = "Window number, or 0 for the front window"

[params.tab]
type = "integer"
description = "Tab number, or 0 for the active tab"

[params.lines]
type = "integer"
description = "How many last lines, default 40"
required = false
