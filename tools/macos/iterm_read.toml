description = "Read the text of the iTerm2 tab in front (its last lines), straight from the terminal: better than a screenshot."
command = ["/usr/bin/osascript", "-l", "JavaScript", "./iterm.js", "read", "{target}", "{lines}"]
timeout = 20
read_only = true

[params.target]
description = "Another tab, as window.tab from iterm_tabs (for example 2.3). Leave it out: the tool works on the tab in front, which the user sees. Give it only when the user named another tab."
required = false

[params.lines]
type = "integer"
description = "How many last lines, default 40"
required = false
