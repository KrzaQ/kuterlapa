description = "Switch to a Google Chrome tab: the tab, its window and Chrome come to the front, on whatever desktop the window is, so the user sees it. Call it whenever the user wants to go to a tab, even the active one: the active tab of Chrome's front window may sit behind another application or on another desktop. After that, the other chrome_* tools work on it without a target."
command = ["/usr/bin/osascript", "-l", "JavaScript", "./chrome.js", "tab", "{target}"]
timeout = 20

[params.target]
description = "The tab as window.tab from chrome_tabs, for example 2.5"
