description = "Bring a Google Chrome tab to the front, by the numbers from chrome_tabs."
command = ["/usr/bin/osascript", "-l", "JavaScript", "./chrome.js", "tab", "{window}", "{tab}"]
timeout = 20

[params.window]
type = "integer"
description = "Window number, the part before the dot"

[params.tab]
type = "integer"
description = "Tab number, the part after the dot"
