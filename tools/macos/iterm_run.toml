description = "Run a shell command in an iTerm2 tab and answer with only the output that came after it (old text in the tab is left out). The text goes straight to the tab, whatever window is in front; prefer it to computer_type for terminals. Use the SSH aliases the user has (ssh <alias>); never type passwords. For a long command, give more seconds, or read the tab later with iterm_read."
command = ["/usr/bin/osascript", "-l", "JavaScript", "./iterm.js", "run", "{window}", "{tab}", "{command}", "{seconds}"]
timeout = 130

[params.window]
type = "integer"
description = "Window number from iterm_tabs, or 0 for the front window"

[params.tab]
type = "integer"
description = "Tab number from iterm_tabs, or 0 for the active tab"

[params.command]
description = "The command line to run"

[params.seconds]
type = "integer"
description = "How long to wait for output, default 10, at most 120"
required = false
