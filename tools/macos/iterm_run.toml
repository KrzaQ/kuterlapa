description = "Run a shell command in the iTerm2 tab in front and answer with only the output that came after it (old text in the tab is left out). The text goes straight to the tab, whatever window is in front; prefer it to computer_type for terminals. Use the SSH aliases the user has (ssh <alias>); never type passwords. For a long command, give more seconds, or read the tab later with iterm_read."
command = ["/usr/bin/osascript", "-l", "JavaScript", "./iterm.js", "run", "{target}", "{command}", "{seconds}"]
timeout = 130

[params.target]
description = "Another tab, as window.tab from iterm_tabs (for example 2.3). Leave it out: the tool works on the tab in front, which the user sees. Give it only when the user named another tab."
required = false

[params.command]
description = "The command line to run"

[params.seconds]
type = "integer"
description = "How long to wait for output, default 10, at most 120"
required = false
