description = "Close Google Chrome tabs. Without tabs it closes the tab the user sees: that is what \"close this tab\" means, even right after you worked in another tab. Closing any other tab needs confirm = \"yes\", and only after the user said which (ask_user when unsure). Cmd+Shift+T in Chrome brings a closed tab back."
command = ["/usr/bin/osascript", "-l", "JavaScript", "./chrome.js", "close", "{tabs}", "{confirm}"]
timeout = 20

[params.tabs]
description = "Tabs as window.tab from chrome_tabs, separated by spaces, for example \"1.4 1.7\". Leave it out for the tab the user sees."
required = false

[params.confirm]
description = "\"yes\" to close tabs other than the one the user sees, after the user agreed"
required = false
