[project]
name = "kuterlapa-embed"
version = "0.1.0"
description = "Embedding provider for Kuterlapa: turns text into vectors for search by meaning, with a local or a remote backend"
readme = "README.md"
license = "MIT OR Apache-2.0"
requires-python = ">=3.12"
dependencies = []

# The openai backend needs nothing beyond Python; the local one needs MLX.
[project.optional-dependencies]
mlx = ["mlx-lm>=0.28", "transformers>=4.51"]

[project.scripts]
kuterlapa-embed = "kuterlapa_embed.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kuterlapa_embed"]
