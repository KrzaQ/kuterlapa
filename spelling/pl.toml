# How people spell in Polish, and how speech recognition writes the names
# of the letters. The spelling decoder (core/src/spell.rs) reads this file.
# Each letter has its names; speech recognition often writes "ka" as "ky",
# "er" as "ry", "te" as "ty".

# Words that join a letter to a word starting with it: "K jak Katarzyna".
connectors = ["jak"]

[letters]
a = ["a"]
"ą" = ["ą", "on"]
b = ["be", "by", "bé"]
c = ["ce", "cy", "tse"]
"ć" = ["cie", "cia"]
d = ["de", "dy"]
e = ["e"]
"ę" = ["ę", "en nosowe"]
f = ["ef", "f", "fy"]
g = ["gie", "gi", "ge", "gy"]
h = ["ha", "cha"]
i = ["i"]
j = ["jot", "jota"]
k = ["ka", "ky", "k", "ko"]
l = ["el", "ly"]
"ł" = ["eł", "ew", "ły"]
m = ["em", "my", "m", "me"]
n = ["en", "ny"]
"ń" = ["eń"]
o = ["o"]
"ó" = ["ó", "u kreskowane", "o z kreską"]
p = ["pe", "py"]
q = ["ku", "kju"]
r = ["er", "ry", "r", "re"]
s = ["es", "sy"]
"ś" = ["eś", "si"]
t = ["te", "ty", "t"]
u = ["u"]
v = ["fau", "vau", "wau"]
w = ["wu", "we", "wy"]
x = ["iks"]
y = ["igrek", "y"]
z = ["zet", "zy"]
"ź" = ["ziet", "zi"]
"ż" = ["żet", "rzet"]

[symbols]
"@" = ["małpa", "małpą", "małpka", "at"]
"." = ["kropka", "kropką", "kropki"]
"_" = ["podkreślnik", "podłoga", "podkreślenie"]
"-" = ["myślnik", "minus", "kreska"]
"/" = ["ukośnik", "slash"]
":" = ["dwukropek"]
" " = ["spacja"]
