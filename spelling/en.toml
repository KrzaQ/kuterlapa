# How people spell in English, and how speech recognition writes the names
# of the letters. The spelling decoder (core/src/spell.rs) reads this file.

# Words that join a letter to a word starting with it: "K as in Kilo".
connectors = ["as in", "for", "like"]

[letters]
a = ["a", "ay", "alpha", "alfa"]
b = ["bee", "be", "bravo"]
c = ["see", "sea", "cee", "charlie"]
d = ["dee", "delta"]
e = ["e", "ee", "echo"]
f = ["ef", "eff", "foxtrot"]
g = ["gee", "golf"]
h = ["aitch", "haitch", "hotel"]
i = ["i", "eye", "india"]
j = ["jay", "juliet", "juliett"]
k = ["kay", "k", "kilo"]
l = ["el", "ell", "lima"]
m = ["em", "mike"]
n = ["en", "november"]
o = ["o", "oh", "oscar"]
p = ["pee", "pea", "papa"]
q = ["queue", "cue", "quebec"]
r = ["ar", "are", "romeo"]
s = ["es", "ess", "sierra"]
t = ["tee", "tea", "tango"]
u = ["you", "u", "uniform"]
v = ["vee", "victor"]
w = ["double-u", "double u", "doubleyou", "whiskey"]
x = ["ex", "x-ray", "xray"]
y = ["why", "wye", "yankee"]
z = ["zed", "zee", "zulu"]

[symbols]
"@" = ["at"]
"." = ["dot", "period", "point"]
"_" = ["underscore"]
"-" = ["dash", "hyphen", "minus"]
"/" = ["slash"]
":" = ["colon"]
" " = ["space"]
