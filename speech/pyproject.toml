[project]
name = "kuterlapa-speech"
version = "0.1.0"
description = "Speech provider for Kuterlapa: local Whisper, sentence by sentence"
readme = "README.md"
license = "MIT OR Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "sounddevice",
]

# One extra per recognition backend; install the one for your system.
[project.optional-dependencies]
mlx = ["mlx-audio>=0.6.1"]
faster-whisper = ["faster-whisper>=1.1"]

[project.scripts]
kuterlapa-speech = "kuterlapa_speech.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kuterlapa_speech"]
