[project]
name = "kuterlapa-voice"
version = "0.1.0"
description = "Voice provider for Kuterlapa: reads text aloud, with swappable speech synthesis backends"
readme = "README.md"
license = "MIT OR Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "sounddevice",
]

# One extra per synthesis backend that needs more than the base.
[project.optional-dependencies]
mlx = ["mlx-audio>=0.6.1"]

[project.scripts]
kuterlapa-voice = "kuterlapa_voice.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kuterlapa_voice"]
