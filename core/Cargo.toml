[package]
name = "kuterlapa"
version = "0.1.0"
edition = "2021"
description = "Core of Kuterlapa: maps controller buttons and speech to actions"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[profile.release]
strip = true
