[package]
name = "kuterlapa"
version = "0.1.0"
edition = "2021"
description = "Core of Kuterlapa: maps controller buttons and speech to actions"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
anyhow = "1"
# A git submodule (git submodule update --init).
lejce = { path = "../lejce" }
# bundled: SQLite is compiled in, so every system gets the same version.
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[profile.release]
strip = true
